# Klask - self-hosted stack (pre-built images from ghcr.io)
#
# Quick start:
#   cp .env.example .env     # then fill in the three required secrets
#   docker compose up -d
#   Frontend: http://localhost:8080
#   Backend API: http://localhost:3000
#
# POSTGRES_PASSWORD, JWT_SECRET and ENCRYPTION_KEY have no default on purpose:
# compose refuses to start until they are set. See .env.example and
# docs/admin/configuration.md. PostgreSQL is not published on the host.
services:
    # PostgreSQL Database
    postgres:
        image: postgres:18-alpine
        container_name: klask-postgres
        environment:
            POSTGRES_DB: klask_dev
            POSTGRES_USER: klask_user
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
        volumes:
            # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker:
            # mount the parent directory, not .../data, or the named volume stays empty.
            - postgres_data:/var/lib/postgresql
        networks:
            - klask-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U klask_user -d klask_dev"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Klask Backend (Rust)
    klask-backend:
        image: ghcr.io/klask-dev/klask-backend:${KLASK_IMAGE_TAG:-latest}
        container_name: klask-backend
        environment:
            - DATABASE_URL=postgres://klask_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/klask_dev
            - RUST_LOG=info
            - PORT=3000
            - HOST=0.0.0.0
            - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (see .env.example)}
            - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
        ports:
            - "3000:3000"
        volumes:
            - klask_data:/app/data
            - klask_index:/app/index
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - klask-network
        restart: unless-stopped

    # Klask Frontend (React)
    klask-frontend:
        image: ghcr.io/klask-dev/klask-frontend:${KLASK_IMAGE_TAG:-latest}
        container_name: klask-frontend
        environment:
            # URL the browser uses to reach the backend API
            - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://localhost:3000}
        ports:
            - "8080:8080"
        networks:
            - klask-network
        restart: unless-stopped

    # Welcome message service - displays URLs and status once everything is ready
    welcome:
        image: alpine:latest
        container_name: klask-welcome
        depends_on:
            klask-backend:
                condition: service_healthy
            klask-frontend:
                condition: service_healthy
        networks:
            - klask-network
        restart: "no"
        entrypoint: /bin/sh
        command:
            - -c
            - |
              echo ""
              echo "╔════════════════════════════════════════════════════════════════╗"
              echo "║                    🚀 Klask is Ready! 🚀                       ║"
              echo "╚════════════════════════════════════════════════════════════════╝"
              echo ""
              echo "📊 Frontend:  http://localhost:8080"
              echo "🔌 Backend:   http://localhost:3000"
              echo ""
              echo "📚 Useful commands:"
              echo "  • View logs:   docker logs -f <container_name>"
              echo "  • Stop:        docker compose -f docker-compose.yml down"
              echo ""
              echo "✅ All services are healthy and running!"
              echo ""

volumes:
    postgres_data:
    klask_data:
    klask_index:

networks:
    klask-network:
        driver: bridge
