name: 1️⃣ Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Read-only token by default; jobs that need more declare it explicitly.
permissions:
  contents: read

# Cancel superseded runs on pull requests (never on pushes to the default branch).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects which directories changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'klask-react/**'
            backend:
              - 'klask-rs/**'
            docker:
              - 'klask-rs/Dockerfile'
              - 'klask-rs/docker-entrypoint.sh'
              - 'klask-react/Dockerfile'
              - 'klask-react/entrypoint.sh'
              - 'klask-react/nginx.conf'
              - 'klask-react/nginx-proxy.inc'
              - '**/.dockerignore'

  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./klask-react

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: klask-react/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run type check
      run: npm run typecheck

    # TODO: remove continue-on-error once the existing ESLint errors are fixed
    # (345 problems at the time of writing: 339 errors, mostly no-explicit-any).
    - name: Run lint
      run: npm run lint:ci
      continue-on-error: true

    - name: Run tests
      run: npm run test:ci

    - name: Build frontend
      run: npm run build

    # TODO: make blocking once the high-severity advisories are resolved
    # (npm audit reported 10 high and 13 moderate advisories on 2026-11-11).
    - name: Audit dependencies
      run: npm audit --audit-level=high
      continue-on-error: true

  test-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./klask-rs

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klask_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        components: rustfmt, clippy
        toolchain: stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: klask-rs

    - name: Check formatting
      run: cargo fmt -- --check

    # --all-targets also lints the tests, benches and examples
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/klask_test

    # Tests marked #[ignore = "Requires PostgreSQL database"] are skipped by
    # plain `cargo test`; run the suites known to be green against the service
    # container. (admin_endpoints_test is excluded: its ignored tests are stale.)
    - name: Run PostgreSQL-backed integration tests
      run: |
        cargo test --test mcp_test -- --ignored
        cargo test --test search_service_test -- --ignored
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/klask_test

  # The semantic-search feature (fastembed, lancedb) is opt-in and not part of
  # the default build, so it needs its own job. Its model-dependent tests are
  # #[ignore]d and never download a model here.
  test-backend-semantic:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./klask-rs

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        components: clippy
        toolchain: stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: klask-rs
        key: semantic-search

    # The vector store (lance) generates code from .proto files at build time.
    # libprotobuf-dev provides the well-known types they import (google/protobuf/*.proto).
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

    - name: Run clippy (semantic-search)
      run: cargo clippy --all-targets --features semantic-search -- -D warnings

    - name: Run unit tests (semantic-search)
      run: cargo test --features semantic-search --lib

  # Builds the images without pushing, only when a Dockerfile or entrypoint
  # changed. Images are built and pushed on the default branch by
  # 2-build-images.yml, which does not run on pull requests.
  docker-build-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./klask-rs
          - name: frontend
            context: ./klask-react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          cache-from: type=gha,scope=pr-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.name }}

  # Supply-chain checks on the Rust dependency tree. Configuration: klask-rs/deny.toml
  # (advisories, licenses, sources). Runs on every pull request, whatever changed.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: klask-rs/Cargo.toml
          command: check licenses sources

      # TODO: make blocking once the advisories reported on 2026-11-11 are triaged
      # (19 vulnerability/unsound findings, mostly in lance/lancedb, reqwest/rustls and tantivy).
      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        continue-on-error: true
        with:
          manifest-path: klask-rs/Cargo.toml
          command: check advisories

  # Single required status check: succeeds when every needed job succeeded or
  # was legitimately skipped (paths filter). Configure branch protection to
  # require "CI OK" only.
  ci-ok:
    name: CI OK
    if: always()
    needs: [detect-changes, test-frontend, test-backend, test-backend-semantic, docker-build-check, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          DETECT: ${{ needs.detect-changes.result }}
          FRONTEND: ${{ needs.test-frontend.result }}
          BACKEND: ${{ needs.test-backend.result }}
          BACKEND_SEMANTIC: ${{ needs.test-backend-semantic.result }}
          DOCKER: ${{ needs.docker-build-check.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          status=0
          for result in "$DETECT" "$FRONTEND" "$BACKEND" "$BACKEND_SEMANTIC" "$DOCKER" "$AUDIT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job finished with result: $result"; status=1 ;;
            esac
          done
          exit $status
