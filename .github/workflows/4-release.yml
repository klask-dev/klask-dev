name: 4️⃣ Release

on:
  workflow_run:
    workflows: ["1️⃣ Tests"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

# Read-only by default; the release job declares the write permissions it needs.
permissions:
  contents: read

# Never cancel a running release: two releases must not interleave.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install semantic-release and plugins
        run: |
          # Majors are pinned on purpose: an unpinned install picked
          # conventional-changelog-conventionalcommits 10, which needs
          # conventional-changelog-writer 9 while release-notes-generator 14
          # still ships writer 8, and every release failed with "Missing helper".
          # Bump these together, after checking that the notes still render.
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/exec@7 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@9

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
