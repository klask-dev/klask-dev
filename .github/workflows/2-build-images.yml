name: 2️⃣ Build images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1️⃣ Tests"]
    types:
      - completed
    branches:
      - main
      - master
      - 'releases/**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: klask-frontend
  BACKEND_IMAGE_NAME: klask-backend

jobs:
  # Detects which directories changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'klask-react/**'
            backend:
              - 'klask-rs/**'

  build-frontend:
    needs: detect-changes
    # Conditions:
    # - default branch: always (keeps the versions homogeneous)
    # - other branches: only when the frontend changed
    # - manual run: only when the frontend changed
    if: (github.event.workflow_run.conclusion == 'success' &&
            (startsWith(github.event.workflow_run.head_branch, 'main') ||
             startsWith(github.event.workflow_run.head_branch, 'master') ||
             needs.detect-changes.outputs.frontend == 'true')) ||
            (github.event_name == 'workflow_dispatch' &&
             needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Build the commit that the tests validated, not the current default branch tip
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (frontend)
      id: meta-frontend
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Get build metadata (frontend)
      id: build-meta-frontend
      run: |
        echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "commit=${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_OUTPUT
        echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Build and push frontend
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./klask-react
        file: ./klask-react/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        build-args: |
          VITE_APP_VERSION=${{ steps.build-meta-frontend.outputs.version }}
          VITE_APP_COMMIT=${{ steps.build-meta-frontend.outputs.commit }}
          VITE_APP_BUILD_TIME=${{ steps.build-meta-frontend.outputs.build_time }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-backend:
    needs: detect-changes
    # Conditions: same as build-frontend, for the backend
    if: (github.event.workflow_run.conclusion == 'success' &&
            (startsWith(github.event.workflow_run.head_branch, 'main') ||
             startsWith(github.event.workflow_run.head_branch, 'master') ||
             needs.detect-changes.outputs.backend == 'true')) ||
            (github.event_name == 'workflow_dispatch' &&
             needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (backend)
      id: meta-backend
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Get build metadata (backend)
      id: build-meta-backend
      run: |
        echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "commit=${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_OUTPUT
        echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Build and push backend
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./klask-rs
        file: ./klask-rs/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        build-args: |
          KLASK_VERSION=${{ steps.build-meta-backend.outputs.version }}
          GIT_COMMIT_HASH=${{ steps.build-meta-backend.outputs.commit }}
          BUILD_TIMESTAMP=${{ steps.build-meta-backend.outputs.build_time }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Optional: make the packages public automatically (uncomment if wanted)
    # - name: Make frontend package public
    #   run: |
    #     gh api -X PATCH "/user/packages/container/klask-frontend/versions" \
    #       --field visibility=public
    #   env:
    #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #
    # - name: Make backend package public
    #   run: |
    #     gh api -X PATCH "/user/packages/container/klask-backend/versions" \
    #       --field visibility=public
    #   env:
    #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan-frontend:
    needs: [detect-changes, build-frontend]
    # Same condition as build-frontend: scan when the image was built
    if: (github.event.workflow_run.conclusion == 'success' &&
            (startsWith(github.event.workflow_run.head_branch, 'main') ||
             startsWith(github.event.workflow_run.head_branch, 'master') ||
             needs.detect-changes.outputs.frontend == 'true')) ||
            (github.event_name == 'workflow_dispatch' &&
             needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Needed to upload SARIF results to code scanning
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Determine image tag for security scan
      id: tag
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Pull requests: use pr-NUMBER
          echo "tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_type }}" == "tag" ]]; then
          # Git tags (v1.0.0): use the version
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
          # main/master: use latest
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          # Other branches: use the cleaned branch name
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$CLEAN_BRANCH_NAME" >> $GITHUB_OUTPUT
        fi

    # Pinned to the commit of tag 0.28.0 (the tag is "0.28.0", without "v")
    - name: Run Trivy vulnerability scanner (frontend)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        format: 'sarif'
        output: 'trivy-frontend.sarif'

    - name: Upload Trivy scan results (frontend)
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: 'trivy-frontend.sarif'
        category: 'trivy-frontend'

  security-scan-backend:
    needs: [detect-changes, build-backend]
    # Same condition as build-backend: scan when the image was built
    if: (github.event.workflow_run.conclusion == 'success' &&
            (startsWith(github.event.workflow_run.head_branch, 'main') ||
             startsWith(github.event.workflow_run.head_branch, 'master') ||
             needs.detect-changes.outputs.backend == 'true')) ||
            (github.event_name == 'workflow_dispatch' &&
             needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Determine image tag for security scan
      id: tag
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Pull requests: use pr-NUMBER
          echo "tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_type }}" == "tag" ]]; then
          # Git tags (v1.0.0): use the version
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
          # main/master: use latest
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          # Other branches: use the cleaned branch name
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$CLEAN_BRANCH_NAME" >> $GITHUB_OUTPUT
        fi

    # Was "@master" (mobile reference); now pinned like the frontend scan
    - name: Run Trivy vulnerability scanner (backend)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        format: 'sarif'
        output: 'trivy-backend.sarif'

    - name: Upload Trivy scan results (backend)
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: 'trivy-backend.sarif'
        category: 'trivy-backend'
