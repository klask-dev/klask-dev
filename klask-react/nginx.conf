server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Generate nonce for CSP
    set $csp_nonce $request_id;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: https:; connect-src 'self' wss: ws:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and MCP requests are relayed to the backend, so that the interface,
    # the API and the MCP endpoint can be served from a single origin.
    # entrypoint.sh writes the DNS resolver and the $backend variable
    # (BACKEND_UPSTREAM, default klask-backend:3000) into this file at start.
    # Resolving through a variable lets nginx start, and keep running, while
    # the backend is down or being replaced.
    include /tmp/klask-nginx-backend.conf;

    # ^~ : API paths are never handed to the static assets location above,
    # even when they end with .js, .css, ...
    location ^~ /api {
        include /etc/nginx/klask-proxy.inc;
    }

    location = /mcp {
        include /etc/nginx/klask-proxy.inc;
    }

    # Fallback for unavailable backend
    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error": "Backend service unavailable", "message": "The Klask backend cannot be reached from the frontend container (BACKEND_UPSTREAM)."}';
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Substitute CSP nonce into HTML script tags
        sub_filter '__CSP_NONCE__' '$csp_nonce';
        sub_filter_once off;

        # Prevent caching of index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
