# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
#
# Run locally from klask-rs/:  cargo deny check licenses sources
#                              cargo deny check advisories
#
# Klask is GPL-3.0-only (see ../LICENSE). Dependencies must carry a license
# that can be combined with GPL-3.0: permissive licenses and LGPL/MPL are fine.

[advisories]
# Vulnerabilities and unmaintained crates. Known open advisories are reported
# but the CI job is non-blocking until they are triaged.
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "zlib-acknowledgement",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "Unlicense",
    "LGPL-2.1-or-later",
    # The project itself (see the clarify entry below)
    "GPL-3.0-only",
]
confidence-threshold = 0.9

# The project itself has no `license` field in klask-rs/Cargo.toml, so cargo-deny
# reports it as unlicensed. TODO: add `license = "GPL-3.0-only"` to Cargo.toml,
# then remove this line.
[[licenses.clarify]]
name = "klask-rs"
expression = "GPL-3.0-only"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
