# Klask development stack: builds the backend and frontend from this checkout.
# For a normal installation use docker-compose.yml (pre-built images) instead.
#
# The secrets below are fixed development values. They are public: never reuse
# them for an instance that holds real data. All ports are bound to 127.0.0.1.
#
# Quick Start:
#   docker compose -f docker-compose.dev.yml up -d
#   Access frontend: http://localhost:8081
#   Access backend API: http://localhost:3001
#   PostgreSQL (database only): docker compose -f docker-compose.dev.yml up -d postgres
#     -> postgres://klask_user:klask_password@localhost:5433/klask_dev
#   Access pgAdmin: http://localhost:5050 (with --profile tools)
#
# Startup Order:
#   1. PostgreSQL starts first
#   2. Backend waits for database to be healthy
#   3. Frontend waits for backend to be healthy
#   4. Welcome service displays URLs when everything is ready
#
# With optional tools (pgAdmin, Redis; the backend does not use Redis today):
#   docker compose -f docker-compose.dev.yml --profile tools up -d

services:
    # PostgreSQL Database
    postgres:
        image: postgres:18-alpine
        container_name: klask-postgres-dev
        environment:
            POSTGRES_DB: klask_dev
            POSTGRES_USER: klask_user
            POSTGRES_PASSWORD: klask_password
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - klask-network
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512M

    # Klask Backend (Rust)
    klask-backend:
        build:
            context: klask-rs
            dockerfile: Dockerfile
        container_name: klask-backend
        environment:
            - DATABASE_URL=postgres://klask_user:klask_password@postgres:5432/klask_dev
            - RUST_LOG=info
            - PORT=3000
            - HOST=0.0.0.0
            # Development-only values (JWT_SECRET must be at least 32 characters)
            - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-only-encryption-key-01234567}
            - JWT_SECRET=${JWT_SECRET:-dev-only-jwt-secret-not-for-production-0123456789}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081}
            # Security defaults (see klask-rs/.env.example): registration closed,
            # cookie without Secure (set COOKIE_SECURE=true behind HTTPS).
            - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
            - COOKIE_SECURE=${COOKIE_SECURE:-false}
            # The browser calls the backend directly (BACKEND_BASE_URL), with no proxy in between,
            # so X-Forwarded-For is ignored. Set the number of proxies only if you put a reverse
            # proxy in front of the backend: see docs/admin/configuration.md.
            - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
            - ALLOW_PRIVATE_NETWORK_URLS=${ALLOW_PRIVATE_NETWORK_URLS:-true}
        ports:
            - "127.0.0.1:3001:3000"
        volumes:
            - klask_data:/app/data
            - klask_index:/app/index
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - klask-network
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 2G


    # Klask Frontend (React)
    klask-frontend:
        build:
            context: klask-react
            dockerfile: Dockerfile
        container_name: klask-frontend
        ports:
            - "127.0.0.1:8081:8080"
        networks:
            - klask-network
        restart: unless-stopped
        environment:
            # Backend is exposed on localhost:3000, frontend calls it directly
            # No nginx proxy needed since backend has permissive CORS
            BACKEND_BASE_URL: "http://localhost:3001"
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M

    # Welcome message service - displays URLs and status once everything is ready
    welcome:
        image: alpine:latest
        container_name: klask-welcome
        depends_on:
            klask-backend:
                condition: service_healthy
            klask-frontend:
                condition: service_healthy
        networks:
            - klask-network
        restart: "no"
        deploy:
            resources:
                limits:
                    cpus: "0.1"
                    memory: 32M
        entrypoint: /bin/sh
        command:
            - -c
            - |
              echo ""
              echo "╔════════════════════════════════════════════════════════════════╗"
              echo "║                    🚀 Klask is Ready! 🚀                       ║"
              echo "╚════════════════════════════════════════════════════════════════╝"
              echo ""
              echo "📊 Frontend:  http://localhost:8081"
              echo "🔌 Backend:   http://localhost:3001"
              echo "🗄️  Database:  localhost:5433 (host side)"
              echo ""
              echo "📚 Useful commands:"
              echo "  • View logs:   docker logs -f <container_name>"
              echo "  • Stop:        docker compose -f docker-compose.dev.yml down"
              echo "  • With tools:  docker compose -f docker-compose.dev.yml --profile tools up -d"
              echo ""
              echo "✅ All services are healthy and running!"
              echo ""

    # Optional: pgAdmin for database management
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: klask-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@klask.dev
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "127.0.0.1:5050:80"
        depends_on:
            - postgres
        networks:
            - klask-network
        profiles:
            - tools
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M

    # Redis for caching (optional for future use)
    redis:
        image: redis:7-alpine
        container_name: klask-redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        networks:
            - klask-network
        profiles:
            - tools
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M

volumes:
    postgres_data:
    redis_data:
    klask_data:
    klask_index:

networks:
    klask-network:
        driver: bridge
